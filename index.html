<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a1a">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a1a;--glass:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.12);--glass-strong:rgba(255,255,255,.15);--accent:#6c63ff;--accent-glow:rgba(108,99,255,.4);--accent2:#00d4aa;--danger:#ff4757;--warning:#ffa502;--text:#e8e8f0;--text-dim:#8888a8;--text-muted:#555570;--radius:16px;--radius-sm:10px;--radius-xs:6px;--shadow:0 8px 32px rgba(0,0,0,.4);--transition:all .3s cubic-bezier(.4,0,.2,1)}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
.bg-animation{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.bg-animation .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;animation:float 20s ease-in-out infinite}.bg-animation .orb:nth-child(1){width:600px;height:600px;background:#6c63ff;top:-10%;left:-10%}.bg-animation .orb:nth-child(2){width:400px;height:400px;background:#00d4aa;bottom:-10%;right:-10%;animation-delay:-7s}.bg-animation .orb:nth-child(3){width:300px;height:300px;background:#ff6b9d;top:50%;left:50%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-80px) scale(1.1)}50%{transform:translate(-30px,60px) scale(.95)}75%{transform:translate(-60px,-40px) scale(1.05)}}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(108,99,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,.03) 1px,transparent 1px);background-size:60px 60px}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow)}.glass-strong{background:var(--glass-strong)}
.app{position:relative;z-index:1;min-height:100vh}.container{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}
.page{display:none;animation:fadeIn .4s ease}.page.active{display:block}.page.login-page.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.header{padding:16px 0;position:sticky;top:0;z-index:100;background:rgba(10,10,26,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border)}.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.2rem}.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 20px var(--accent-glow)}.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:.85rem;font-weight:500;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 4px 15px var(--accent-glow)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 25px var(--accent-glow)}
.btn-secondary{background:var(--glass);color:var(--text);border:1px solid var(--glass-border)}.btn-secondary:hover{background:rgba(255,255,255,.1);border-color:var(--accent)}
.btn-danger{background:rgba(255,71,87,.15);color:var(--danger);border:1px solid rgba(255,71,87,.2)}.btn-danger:hover{background:rgba(255,71,87,.25)}
.btn-success{background:rgba(0,212,170,.15);color:var(--accent2);border:1px solid rgba(0,212,170,.2)}.btn-success:hover{background:rgba(0,212,170,.25)}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:var(--radius-xs)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);cursor:pointer;transition:var(--transition);position:relative}.btn-icon:hover{background:rgba(255,255,255,.1);border-color:var(--accent);color:var(--accent)}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 6px rgba(255,71,87,0)}}
.login-page{align-items:center;justify-content:center;min-height:100vh;padding:24px;width:100%}.login-card{width:100%;max-width:400px;padding:44px 36px;text-align:center}.login-card .logo-icon{width:60px;height:60px;font-size:1.6rem;margin:0 auto 20px}.login-card h1{font-size:1.6rem;margin-bottom:8px}.login-card>p{color:var(--text-dim);margin-bottom:28px;font-size:.85rem}.login-error{color:var(--danger);font-size:.82rem;margin-bottom:14px;display:none}
.input-group{position:relative;margin-bottom:18px;text-align:left}.input-group label{display:block;font-size:.75rem;font-weight:500;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.9rem;transition:var(--transition);outline:none}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.input-group textarea{resize:vertical;min-height:70px}.input-group select{appearance:none;cursor:pointer}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:28px 0}.stat-card{padding:18px;display:flex;align-items:center;gap:12px;transition:var(--transition);cursor:pointer}.stat-card:hover{transform:translateY(-3px);border-color:rgba(108,99,255,.3)}.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}.stat-icon.purple{background:rgba(108,99,255,.15);color:var(--accent)}.stat-icon.green{background:rgba(0,212,170,.15);color:var(--accent2)}.stat-icon.orange{background:rgba(255,165,2,.15);color:var(--warning)}.stat-icon.red{background:rgba(255,71,87,.15);color:var(--danger)}.stat-info h3{font-size:1.3rem;font-weight:700;line-height:1}.stat-info p{font-size:.7rem;color:var(--text-dim);margin-top:2px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}.section-header h2{font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:8px}.section-header h2 i{color:var(--accent)}
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:40px}.member-card{padding:20px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}.member-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .3s ease}.member-card:hover{transform:translateY(-3px);border-color:rgba(108,99,255,.3)}.member-card:hover::before{transform:scaleX(1)}
.member-avatar{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;box-shadow:0 4px 12px var(--accent-glow);flex-shrink:0;overflow:hidden}.member-avatar img,.profile-avatar img{width:100%;height:100%;object-fit:cover}
.member-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(255,255,255,.05);border-radius:20px;font-size:.72rem;color:var(--text-dim)}.member-tag.blood{background:rgba(255,71,87,.1);color:#ff6b81}.member-tag.relation{background:rgba(108,99,255,.12);color:var(--accent)}.member-tag.alert{background:rgba(255,71,87,.1);color:var(--danger)}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,.03);border-radius:var(--radius-sm);padding:4px;border:1px solid var(--glass-border);overflow-x:auto}.tab-btn{flex:1;padding:10px 14px;border:none;border-radius:var(--radius-xs);background:transparent;color:var(--text-dim);font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.tab-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-glow)}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--text-dim);font-size:.85rem;cursor:pointer;margin-bottom:20px;transition:var(--transition)}.back-btn:hover{color:var(--accent)}
.profile-avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#fff;box-shadow:0 4px 16px var(--accent-glow);overflow:hidden;flex-shrink:0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.info-item{padding:12px;background:rgba(255,255,255,.03);border-radius:var(--radius-sm)}.info-item label{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);display:block;margin-bottom:3px}.info-item span{font-size:.9rem;font-weight:500}
.copy-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;border:none;background:rgba(108,99,255,.12);color:var(--accent);cursor:pointer;font-size:.65rem;margin-left:5px;transition:var(--transition);vertical-align:middle}.copy-btn:hover{background:rgba(108,99,255,.25)}
.record-card{padding:18px;border-radius:var(--radius-sm);background:rgba(255,255,255,.03);border:1px solid var(--glass-border);margin-bottom:12px}.record-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.83rem}.record-body .rl{color:var(--text-muted);font-size:.68rem;text-transform:uppercase}
.med-card{padding:16px;border-radius:var(--radius-sm);background:rgba(255,255,255,.03);border:1px solid var(--glass-border);margin-bottom:12px;display:flex;gap:14px;align-items:center}.med-card.low{border-color:rgba(255,165,2,.4);background:rgba(255,165,2,.02)}.med-card.out{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.02)}
.med-icon{width:40px;height:40px;border-radius:10px;background:rgba(108,99,255,.12);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}.med-card.low .med-icon{background:rgba(255,165,2,.15);color:var(--warning)}.med-card.out .med-icon{background:rgba(255,71,87,.15);color:var(--danger)}
.med-info{flex:1;min-width:0}.med-info h4{font-size:.9rem;font-weight:600;margin-bottom:2px}.med-info .med-sub{font-size:.78rem;color:var(--text-dim)}
.med-stock{text-align:right;flex-shrink:0}.med-stock .num{font-size:1.2rem;font-weight:700}.med-stock .lbl{font-size:.65rem;color:var(--text-dim)}.stock-bar{width:70px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:4px;overflow:hidden}.stock-bar div{height:100%;border-radius:3px}.stock-bar .good{background:var(--accent2)}.stock-bar .warn{background:var(--warning)}.stock-bar .bad{background:var(--danger)}
.doc-table{width:100%;border-collapse:collapse}.doc-table th{text-align:left;padding:10px 14px;font-size:.72rem;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--glass-border)}.doc-table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem}
.doc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:500}.doc-badge.id-doc{background:rgba(108,99,255,.15);color:var(--accent)}.doc-badge.medical{background:rgba(0,212,170,.15);color:var(--accent2)}.doc-badge.insurance{background:rgba(255,165,2,.15);color:var(--warning)}.doc-badge.other{background:rgba(255,255,255,.08);color:var(--text-dim)}
.empty-state{text-align:center;padding:40px;color:var(--text-dim)}.empty-state i{font-size:2.5rem;margin-bottom:12px;opacity:.3}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.active{display:flex}.modal{width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:32px;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h2{font-size:1.2rem;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:10px}.modal h2 i{color:var(--accent)}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.photo-upload{display:flex;align-items:center;gap:14px;margin-bottom:18px}.photo-preview{width:64px;height:64px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;overflow:hidden}.photo-preview img{width:100%;height:100%;object-fit:cover}
.file-drop{border:2px dashed var(--glass-border);border-radius:var(--radius-sm);padding:28px;text-align:center;cursor:pointer;transition:var(--transition);margin-bottom:14px}.file-drop:hover,.file-drop.dragover{border-color:var(--accent);background:rgba(108,99,255,.05)}.file-drop i{font-size:1.8rem;color:var(--text-muted);margin-bottom:6px}.file-drop p{color:var(--text-dim);font-size:.82rem}.file-drop .file-name{color:var(--accent);font-weight:500;margin-top:6px}
.queue-name{flex:1;min-width:0;font-size:.8rem;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:6px;padding:6px 9px;color:var(--text);font-family:inherit}.queue-name:focus{outline:none;border-color:var(--accent);background:rgba(108,99,255,.06)}
.img-viewer{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;cursor:zoom-out}.img-viewer.active{display:flex}.img-viewer img{max-width:90vw;max-height:75vh;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain}.img-viewer .viewer-actions{display:flex;gap:10px}.img-viewer .viewer-name{color:var(--text-dim);font-size:.85rem;margin-bottom:4px}
.att-thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--glass-border);cursor:pointer;transition:var(--transition);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03)}.att-thumb:hover{border-color:var(--accent);transform:scale(1.05)}.att-thumb img{width:100%;height:100%;object-fit:cover}.att-thumb i{font-size:1.1rem;color:var(--text-muted)}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:6px;transition:var(--transition);cursor:pointer}.att-row:hover{background:rgba(255,255,255,.04)}
.att-row.rx{border-left:3px solid var(--accent2);background:rgba(0,212,170,.03)}.att-row.report{border-left:3px solid var(--accent);background:rgba(108,99,255,.03)}.att-row.general{border-left:3px solid var(--warning);background:rgba(255,165,2,.03)}
.notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:360px;overflow-y:auto;padding:16px;z-index:200;display:none}.notif-panel.show{display:block}.notif-item{padding:10px;border-radius:var(--radius-xs);background:rgba(255,255,255,.03);margin-bottom:6px;border-left:3px solid var(--warning);font-size:.82rem}.notif-item.urgent{border-left-color:var(--danger)}.notif-item b{display:block;margin-bottom:2px}.notif-item span{color:var(--text-dim);font-size:.75rem}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}.toast{padding:12px 18px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;font-size:.85rem;animation:toastIn .3s ease;min-width:240px;background:rgba(20,20,40,.95);backdrop-filter:blur(20px);border:1px solid var(--glass-border)}.toast.success{border-left:3px solid var(--accent2)}.toast.error{border-left:3px solid var(--danger)}.toast.warning{border-left:3px solid var(--warning)}.toast.info{border-left:3px solid var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.spinner{width:30px;height:30px;border:3px solid var(--glass-border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.search-box{position:relative}.search-box input{width:200px;padding:8px 14px 8px 34px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:.85rem;outline:none;transition:var(--transition)}.search-box input:focus{border-color:var(--accent);width:260px}.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.8rem}
@media(max-width:768px){.members-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.stats-bar{grid-template-columns:1fr 1fr}.search-box input{width:140px}.record-body{grid-template-columns:1fr}.notif-panel{width:calc(100vw - 48px)}.header-actions .btn span.hide-mobile{display:none}.med-card{flex-wrap:wrap}.med-stock{margin-left:54px}.profile-avatar{width:44px;height:44px;font-size:1.2rem;border-radius:12px}#memberActions{gap:6px}#memberActions .btn{padding:8px 12px;font-size:.78rem}}
@media(max-width:480px){.stats-bar{grid-template-columns:1fr}html{font-size:14px}.tab-btn{padding:8px 10px;font-size:.72rem}.tab-btn i{display:none}.header-inner{gap:6px}.search-box{order:10;width:100%}.search-box input{width:100%}.login-card{padding:28px 20px}#memberActions .btn{flex:1;justify-content:center;min-width:0}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:3px}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;box-shadow:0 6px 25px var(--accent-glow);z-index:50;transition:var(--transition);border:none}.fab:hover{transform:scale(1.1)}
.emergency-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid var(--danger);border-radius:var(--radius);padding:24px;max-width:400px;margin:0 auto}
.emergency-card h3{color:var(--danger);font-size:1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.emergency-card .ec-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem}.ec-row:last-child{border:none}.ec-row .ec-label{color:var(--text-dim);font-size:.75rem;text-transform:uppercase}.ec-row .ec-val{font-weight:600;text-align:right}

<script>
// ============================================================

// FamilyVault - Complete App

let cache={}, fileCache={}, uploadedMap={};

// Replace inline base64 (photos/files) with a private Drive reference before saving to the sheet.
// Files are named after the document's display name (or member name for photos).
async function slim(v){
  if(Array.isArray(v)){const out=[];for(const x of v)out.push(await slim(x));return out}

async function fatten(v){
  if(Array.isArray(v)){const out=[];for(const x of v)out.push(await fatten(x));return out}

  if(typeof v==='string'&&v.indexOf('drive:')===0){
    const id=v.slice(6);
    if(fileCache[id]){uploadedMap[fileCache[id]]=v;return fileCache[id]}

  }

    let val=data[k];

function handleLogin(){
  var user=(document.getElementById('usernameInput').value||'').trim().toLowerCase();
  var pw=document.getElementById('passwordInput').value.trim();
  var errEl=document.getElementById('loginError');
  if(!user||!pw){errEl.querySelector('span').textContent='Enter username and password.';errEl.style.display='block';return}
  if(LOCAL_MODE){
    var users=_lsGet('users',{});var key=localHash(user+':'+pw);
    if(!Object.keys(users).length){users[user]={hash:key,role:'admin',created:new Date().toISOString()};_lsSet('users',users);localStorage.setItem('fv_auth','1');localStorage.setItem('fv_user',user);toast('Account created! You are admin.','success');showDashboard()}
    else if(users[user]&&users[user].hash===key){localStorage.setItem('fv_auth','1');localStorage.setItem('fv_user',user);showDashboard()}
    else if(users[user]){errEl.querySelector('span').textContent='Wrong password.';errEl.style.display='block'}
    else{errEl.querySelector('span').textContent='User not found. Ask admin to add you.';errEl.style.display='block'}
    return;
  }
  // Google mode: authenticate against the sheet, then load the vault
  errEl.style.display='none';
  var btn=document.querySelector('.login-card .btn-primary');var orig=btn.innerHTML;
  btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0 auto"></div>';btn.disabled=true;
  API.login(user,pw).then(async function(res){
    if(!res){btn.innerHTML=orig;btn.disabled=false;errEl.querySelector('span').textContent='Network error. Try again.';errEl.style.display='block';return}
    if(res.valid){
      API.setToken(res.token);localStorage.setItem('fv_auth','1');localStorage.setItem('fv_user',res.username);
      btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0 auto"></div>';
      await bootstrap();
      btn.innerHTML=orig;btn.disabled=false;
      toast(res.created?'Vault created! You are admin.':'Welcome, '+res.username+'!','success');
      showDashboard();
    }else{
      btn.innerHTML=orig;btn.disabled=false;errEl.querySelector('span').textContent=res.error||'Invalid credentials.';errEl.style.display='block';
    }
  }).catch(function(e){btn.innerHTML=orig;btn.disabled=false;errEl.querySelector('span').textContent='Network error: '+e.message;errEl.style.display='block'});
}

function doGlobalSearch(q){q=(q||'').trim().toLowerCase();var box=document.getElementById('globalSearchResults');if(!box)return;if(q.length<2){box.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:.85rem">Type at least 2 characters.</div>';return}var res=[];var mem=LS.get('members',[]);function hit(t){return t&&String(t).toLowerCase().indexOf(q)>=0}mem.forEach(function(m){if([m.name,m.relation,m.phone,m.email,m.bloodGroup,m.medicalConditions,m.address].some(hit))res.push({icon:'fa-user',color:'var(--accent)',title:m.name,sub:[m.relation,m.bloodGroup].filter(Boolean).join(' · ')||'Member',go:function(){viewMember(m.id)}});LS.get('visits_'+m.id,[]).forEach(function(v){if([v.doctor,v.hospital,v.diagnosis,v.notes,v.speciality].some(hit))res.push({icon:'fa-stethoscope',color:'var(--accent2)',title:'Dr. '+(v.doctor||''),sub:m.name+' · '+(v.diagnosis||v.speciality||'Visit')+' · '+fmtDate(v.date),go:function(){viewMember(m.id);switchTab('visits')}})});LS.get('meds_'+m.id,[]).forEach(function(md){if([md.name,md.dosage,md.doctor,md.notes].some(hit))res.push({icon:'fa-pills',color:'var(--warning)',title:md.name,sub:m.name+' · '+[md.dosage,md.frequency].filter(Boolean).join(' · '),go:function(){viewMember(m.id);switchTab('medications')}})});LS.get('docs_'+m.id,[]).forEach(function(d){if([d.name,d.type,d.fileName].some(hit))res.push({icon:'fa-file',color:'var(--accent)',title:d.name||d.type,sub:m.name+' · '+(d.type||'Document'),go:function(){viewMember(m.id);switchTab('documents')}})});LS.get('metrics_'+m.id,[]).forEach(function(r){if(hit(r.name))res.push({icon:'fa-chart-line',color:'var(--accent2)',title:r.name+': '+r.value,sub:m.name+' · '+fmtDate(r.date),go:function(){viewMember(m.id);switchTab('health')}})})});LS.get('family_notes',[]).forEach(function(n){if(hit(n.text))res.push({icon:'fa-note-sticky',color:'var(--accent2)',title:(n.text||'').slice(0,60),sub:'Family note · '+fmtDate(n.date),go:function(){showDashboard()}})});LS.get('family_expenses',[]).forEach(function(e){if(hit(e.desc))res.push({icon:'fa-indian-rupee-sign',color:'var(--accent)',title:e.desc,sub:'Expense · ₹'+e.amount+(e.member?' · '+e.member:''),go:function(){showDashboard()}})});if(!res.length){box.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:.85rem">No matches for "'+esc(q)+'".</div>';return}window._gsResults=res;box.innerHTML='<div style="font-size:.72rem;color:var(--text-muted);margin-bottom:8px">'+res.length+' result'+(res.length>1?'s':'')+'</div>'+res.slice(0,60).map(function(r,i){return'<div class="record-card" style="cursor:pointer;margin-bottom:8px;padding:11px 13px" onclick="gsGo('+i+')"><div style="display:flex;align-items:center;gap:12px"><div style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas '+r.icon+'" style="color:'+r.color+'"></i></div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+hlt(r.title,q)+'</div><div style="font-size:.72rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+hlt(r.sub,q)+'</div></div></div></div>'}).join('')}
function gsGo(i){var r=(window._gsResults||[])[i];if(!r)return;modal('confirmModal',false);r.go()}

async function generateMemberPDF(m){
  if(!m){toast('Open a member first','info');return}
  toast('Generating PDF…','info');

  var doc=new jsPDF({unit:'mm',format:'a4'});

  y=36;

  doc.text([m.relation,age?age+' yrs':'',m.gender,m.bloodGroup?'Blood '+m.bloodGroup:''].filter(Boolean).join('    |    '),M,y);y+=6;
  function section(t){ny(16);doc.setDrawColor(220);doc.line(M,y,W-M,y);y+=6;doc.setTextColor(108,99,255);doc.setFontSize(12);doc.setFont(undefined,'bold');doc.text(t,M,y);y+=6;doc.setFontSize(10);doc.setFont(undefined,'normal')}
  function row(label,val){if(!val)return;var lblLines=doc.splitTextToSize(String(label),31);var lines=doc.splitTextToSize(String(val),cw-34);var rc=Math.max(lblLines.length,lines.length);ny(rc*5+2);doc.setTextColor(120,120,140);doc.text(lblLines,M,y);doc.setTextColor(40,40,55);doc.text(lines,M+34,y);y+=rc*5+2}
  function none(){doc.setTextColor(150,150,165);doc.text('None recorded',M,y);y+=6}
  section('Profile');row('Phone',m.phone);row('Email',m.email);row('DOB',m.dob?fmtDate(m.dob):'');row('Address',m.address);row('Emergency',m.emergencyContact);
  if(m.medicalConditions){section('Conditions & Allergies');var cl=doc.splitTextToSize(m.medicalConditions,cw);ny(cl.length*5);doc.setTextColor(40,40,55);doc.text(cl,M,y);y+=cl.length*5+2}
  var meds=LS.get('meds_'+m.id,[]).filter(function(x){return x.active!==false});
  section('Current Medications ('+meds.length+')');if(!meds.length)none();
  meds.forEach(function(md){ny(10);doc.setFont(undefined,'bold');doc.setTextColor(40,40,55);doc.text('• '+(md.name||''),M,y);doc.setFont(undefined,'normal');doc.setTextColor(100,100,120);var det=[md.dosage,md.frequency,md.doctor?'Dr. '+md.doctor:'',md.startDate?'since '+fmtDate(md.startDate):''].filter(Boolean).join(', ');var l=doc.splitTextToSize(det||'—',cw-6);doc.text(l,M+6,y+4.5);y+=4.5+l.length*4.5+2});
  var metrics=LS.get('metrics_'+m.id,[]);var names=[];metrics.forEach(function(r){if(names.indexOf(r.name)<0)names.push(r.name)});
  section('Latest Health Metrics');if(!names.length)none();
  names.forEach(function(nm){var arr=metrics.filter(function(r){return r.name===nm}).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});var lt=arr[0];if(!lt)return;var u=(METRICS[nm]&&METRICS[nm].unit)||'';row(nm,lt.value+(u?' '+u:'')+'   ('+fmtDate(lt.date)+')')});
  var visits=LS.get('visits_'+m.id,[]).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')}).slice(0,10);
  section('Recent Doctor Visits');if(!visits.length)none();
  visits.forEach(function(v){ny(10);doc.setFont(undefined,'bold');doc.setTextColor(40,40,55);doc.text(fmtDate(v.date)+'  —  Dr. '+(v.doctor||''),M,y);doc.setFont(undefined,'normal');doc.setTextColor(100,100,120);var det=[v.speciality,v.diagnosis,v.hospital,v.followup?'follow-up '+fmtDate(v.followup):''].filter(Boolean).join(', ');var l=doc.splitTextToSize(det||'—',cw-6);doc.text(l,M+6,y+4.5);y+=4.5+l.length*4.5+2});
  ny(12);y+=4;doc.setFontSize(8);doc.setTextColor(150,150,165);doc.text('Generated by FamilyVault for personal reference. Not an official medical document.',M,y);
  doc.save((m.name||'member').replace(/[^a-z0-9]+/gi,'_')+'_Health_Summary.pdf');
  toast('PDF downloaded','success');
}
// ===== App Lock (device PIN + optional biometric) — stored locally only =====
var _appLocked=false,_hiddenAt=0;
async function sha256Hex(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
function getPinHash(){return localStorage.getItem('fv_pinhash')}
function bioEnabled(){return !!localStorage.getItem('fv_bio')}
function openLockSettings(){if(!getPinHash()){pinSetForm();return}var bioSup=!!window.PublicKeyCredential;var h='<h2 style="justify-content:flex-start"><i class="fas fa-lock" style="color:var(--accent)"></i> App Lock</h2><div style="text-align:left"><p style="color:var(--accent2);font-size:.85rem;margin-bottom:14px"><i class="fas fa-circle-check"></i> App lock is ON for this device.</p>';if(bioSup)h+='<button class="side-item" style="border:1px solid var(--glass-border);margin-bottom:8px" onclick="'+(bioEnabled()?'disableBiometric()':'enableBiometric()')+'"><i class="fas fa-fingerprint"></i> '+(bioEnabled()?'Disable':'Enable')+' biometric unlock</button>';h+='<button class="side-item" style="border:1px solid var(--glass-border);margin-bottom:8px" onclick="pinSetForm()"><i class="fas fa-key"></i> Change PIN</button><button class="side-item" style="border:1px solid rgba(255,71,87,.3);color:var(--danger)" onclick="removePin()"><i class="fas fa-trash-can" style="color:var(--danger)"></i> Remove PIN lock</button><div class="modal-actions"><button class="btn btn-secondary" onclick="modal(\'confirmModal\',false)">Close</button></div></div>';document.getElementById('confirmModalInner').innerHTML=h;document.getElementById('confirmModal').querySelector('.modal').style.maxWidth='420px';modal('confirmModal',true)}
function pinSetForm(){document.getElementById('confirmModalInner').innerHTML='<h2 style="justify-content:flex-start"><i class="fas fa-key" style="color:var(--accent)"></i> Set PIN</h2><div style="text-align:left"><p style="color:var(--text-dim);font-size:.82rem;margin-bottom:12px">A numeric PIN to lock the app. Stored only on this device.</p><div class="input-group"><label>PIN (4–8 digits)</label><input id="lk_pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="input-group"><label>Confirm PIN</label><input id="lk_pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div id="lk_err" style="color:var(--danger);font-size:.8rem;display:none;margin-bottom:8px"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="openLockSettings()">Back</button><button class="btn btn-primary" onclick="savePin()">Save PIN</button></div></div>';document.getElementById('confirmModal').querySelector('.modal').style.maxWidth='420px';modal('confirmModal',true)}
async function savePin(){var a=(document.getElementById('lk_pin1').value||'').trim(),b=(document.getElementById('lk_pin2').value||'').trim();var e=document.getElementById('lk_err');function er(m){if(e){e.textContent=m;e.style.display='block'}}if(!/^[0-9]{4,8}$/.test(a)){er('PIN must be 4–8 digits');return}if(a!==b){er('PINs do not match');return}localStorage.setItem('fv_pinhash',await sha256Hex(a));modal('confirmModal',false);toast('App lock enabled','success')}
function removePin(){localStorage.removeItem('fv_pinhash');localStorage.removeItem('fv_bio');modal('confirmModal',false);toast('App lock removed','success')}
function lockApp(){if(!getPinHash())return;_appLocked=true;sessionStorage.removeItem('fv_unlocked');var el=document.getElementById('lockScreen');if(!el){el=document.createElement('div');el.id='lockScreen';el.style.cssText='position:fixed;inset:0;z-index:4000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px';el.innerHTML='<div class="logo-icon" style="width:58px;height:58px;font-size:1.5rem"><i class="fas fa-lock"></i></div><div style="font-weight:600;color:var(--text)">Enter PIN to unlock</div><input id="lockPin" type="password" inputmode="numeric" maxlength="8" style="width:190px;text-align:center;letter-spacing:6px;font-size:1.2rem;padding:12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);outline:none"><div id="lockErr" style="color:var(--danger);font-size:.8rem;display:none">Wrong PIN, try again</div><button class="btn btn-primary" style="width:190px;justify-content:center" onclick="tryUnlockPin()"><i class="fas fa-lock-open"></i> Unlock</button><button id="lockBioBtn" class="btn btn-secondary" style="width:190px;justify-content:center;display:none" onclick="biometricUnlock()"><i class="fas fa-fingerprint"></i> Use biometric</button>';document.body.appendChild(el);el.querySelector('#lockPin').addEventListener('keydown',function(ev){if(ev.key==='Enter')tryUnlockPin()})}el.style.display='flex';var pin=el.querySelector('#lockPin');if(pin){pin.value='';setTimeout(function(){pin.focus()},120)}el.querySelector('#lockErr').style.display='none';el.querySelector('#lockBioBtn').style.display=bioEnabled()?'inline-flex':'none';if(bioEnabled())biometricUnlock(true)}
async function tryUnlockPin(){var el=document.getElementById('lockScreen');var v=((el&&el.querySelector('#lockPin'))||{}).value||'';if(await sha256Hex(v.trim())===getPinHash()){unlockApp()}else{var er=el&&el.querySelector('#lockErr');if(er)er.style.display='block'}}
function unlockApp(){_appLocked=false;sessionStorage.setItem('fv_unlocked','1');var el=document.getElementById('lockScreen');if(el)el.style.display='none'}
function b64FromBuf(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
function bufFromB64(s){var bin=atob(s);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}
async function enableBiometric(){if(!window.PublicKeyCredential){toast('Biometric not supported on this device','error');return}try{var cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'FamilyVault'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:localStorage.getItem('fv_user')||'user',displayName:'FamilyVault'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});localStorage.setItem('fv_bio',b64FromBuf(cred.rawId));modal('confirmModal',false);toast('Biometric unlock enabled','success')}catch(e){toast('Could not enable biometric','error')}}
function disableBiometric(){localStorage.removeItem('fv_bio');modal('confirmModal',false);toast('Biometric disabled','success')}
async function biometricUnlock(silent){if(!bioEnabled()||!window.PublicKeyCredential)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:bufFromB64(localStorage.getItem('fv_bio')),transports:['internal']}],userVerification:'required',timeout:60000}});unlockApp()}catch(e){if(!silent)toast('Biometric failed — use PIN','error')}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){_hiddenAt=Date.now()}else if(getPinHash()&&!_appLocked&&localStorage.getItem('fv_auth')==='1'&&(Date.now()-_hiddenAt>15000)){lockApp()}});

function renderMembers(list){var g=document.getElementById('membersGrid');if(!list.length){g.innerHTML='<div class="empty-state glass" style="grid-column:1/-1"><i class="fas fa-users-slash"></i><p>No members yet.</p><button class="btn btn-primary" style="margin-top:14px" onclick="openMemberModal()"><i class="fas fa-user-plus"></i> Add your first member</button></div>';return}g.innerHTML=list.map(function(m){var age=m.dob?calcAge(m.dob):'';var meds=LS.get('meds_'+m.id,[]);var activeMeds=meds.filter(function(x){return x.active!==false}).length;var low=meds.filter(function(x){return x.active!==false&&daysLeft(x)<=5}).length;var docsN=LS.get('docs_'+m.id,[]).filter(function(d){return!d.refId}).length;var callNo=m.phone||m.emergencyContact;return'<div class="member-card glass" onclick="viewMember(\''+m.id+'\')"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">'+avatar(m,'member-avatar')+'<div style="flex:1;min-width:0"><h3 style="font-size:1rem;font-weight:600">'+esc(m.name)+'</h3><span style="font-size:.78rem;color:var(--text-dim)">'+[m.relation,age?age+' yrs':'',m.gender].filter(Boolean).join(' &middot; ')+'</span></div>'+(callNo?'<a href="tel:'+esc(callNo)+'" onclick="event.stopPropagation()" class="btn-icon" style="background:rgba(0,212,170,.15);color:var(--accent2);border-color:transparent;flex-shrink:0" title="Call"><i class="fas fa-phone"></i></a>':'')+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+(m.bloodGroup?'<span class="member-tag blood"><i class="fas fa-droplet"></i> '+esc(m.bloodGroup)+'</span>':'')+(activeMeds?'<span class="member-tag"><i class="fas fa-pills"></i> '+activeMeds+' med'+(activeMeds>1?'s':'')+'</span>':'')+(docsN?'<span class="member-tag"><i class="fas fa-file-lines"></i> '+docsN+' doc'+(docsN>1?'s':'')+'</span>':'')+(low?'<span class="member-tag alert"><i class="fas fa-triangle-exclamation"></i> '+low+' low</span>':'')+'</div></div>'}).join('')}
function filterMembers(){var q=document.getElementById('searchInput').value.toLowerCase();renderMembers(members.filter(function(m){return[m.name,m.relation,m.phone,m.bloodGroup].some(function(v){return(v||'').toLowerCase().indexOf(q)>=0})}))}
function updateStats(){document.getElementById('statMembers').textContent=members.length;var docs=0,meds=0,alerts=0;members.forEach(function(m){docs+=LS.get('docs_'+m.id,[]).length;var ml=LS.get('meds_'+m.id,[]);meds+=ml.filter(function(x){return x.active!==false}).length;alerts+=ml.filter(function(x){return x.active!==false&&daysLeft(x)<=5}).length});document.getElementById('statDocs').textContent=docs;document.getElementById('statMeds').textContent=meds;document.getElementById('statAlerts').textContent=alerts}

function docFilterBar(own){var tagSet={};own.forEach(function(d){(d.tags||[]).forEach(function(t){tagSet[t]=1})});var tags=Object.keys(tagSet);var filters=[['all','All'],['id','ID'],['medical','Medical'],['insurance','Insurance'],['general','Other']];return'<div class="doc-filter">'+filters.map(function(f){return'<button class="'+(docFilter===f[0]?'active':'')+'" onclick="docFilter=\''+f[0]+'\';docRerender()">'+f[1]+'</button>'}).join('')+tags.map(function(t){return'<button class="'+(docFilter==='tag:'+t?'active':'')+'" onclick="docFilter=\'tag:'+esc(t).replace(/'/g,"\\'")+'\';docRerender()">#'+esc(t)+'</button>'}).join('')+'<select class="doc-sort" onchange="docSort=this.value;docRerender()"><option value="date"'+(docSort==='date'?' selected':'')+'>Newest</option><option value="name"'+(docSort==='name'?' selected':'')+'>Name A–Z</option><option value="expiry"'+(docSort==='expiry'?' selected':'')+'>Expiry</option></select></div>'}

var _pdflibLoading=null;
function loadPdfLib(){if(window.PDFLib)return Promise.resolve(window.PDFLib);if(_pdflibLoading)return _pdflibLoading;_pdflibLoading=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';s.onload=function(){res(window.PDFLib)};s.onerror=function(){rej(new Error('load failed'))};document.head.appendChild(s)});return _pdflibLoading}
function _b64ToBytes(b64){var bin=atob(b64);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function combineToPdf(docsArr,filename){var PDFLib=await loadPdfLib();var out=await PDFLib.PDFDocument.create();for(var i=0;i<docsArr.length;i++){var d=docsArr[i];if(!d.dataUrl)continue;var mime=(d.dataUrl.match(/^data:([^;]+)/)||[])[1]||'';var bytes=_b64ToBytes(d.dataUrl.split(',')[1]);try{if(mime.indexOf('pdf')>=0){var src=await PDFLib.PDFDocument.load(bytes);var pgs=await out.copyPages(src,src.getPageIndices());pgs.forEach(function(p){out.addPage(p)})}else if(mime.indexOf('png')>=0){var pn=await out.embedPng(bytes);var p1=out.addPage([pn.width,pn.height]);p1.drawImage(pn,{x:0,y:0,width:pn.width,height:pn.height})}else if(mime.indexOf('image')>=0){var jp=await out.embedJpg(bytes);var p2=out.addPage([jp.width,jp.height]);p2.drawImage(jp,{x:0,y:0,width:jp.width,height:jp.height})}}catch(e){}}var b=await out.save();var url=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));var a=document.createElement('a');a.href=url;a.download=filename||'combined.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000)}
function openCombineModal(key){var docs=LS.get(key,[]).filter(function(d){return!d.refId&&d.dataUrl});if(!docs.length){toast('No files available to combine','info');return}window._combineKey=key;var html='<h2 style="justify-content:flex-start"><i class="fas fa-file-circle-plus" style="color:var(--accent)"></i> Combine to PDF</h2><p style="color:var(--text-dim);font-size:.82rem;margin-bottom:10px;text-align:left">Tick the documents to merge into one PDF (order as shown).</p><div style="text-align:left;max-height:50vh;overflow-y:auto">'+docs.map(function(d){return'<label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px;cursor:pointer"><input type="checkbox" class="cmb" value="'+d.id+'" style="width:18px;height:18px;flex-shrink:0"><span style="flex:1;min-width:0;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(d.name)+'</span></label>'}).join('')+'</div><div class="modal-actions"><button class="btn btn-secondary" onclick="modal(\'confirmModal\',false)">Cancel</button><button class="btn btn-primary" onclick="doCombine()"><i class="fas fa-file-pdf"></i> Generate</button></div>';document.getElementById('confirmModalInner').innerHTML=html;document.getElementById('confirmModal').querySelector('.modal').style.maxWidth='460px';modal('confirmModal',true)}
async function doCombine(){var ids=Array.prototype.map.call(document.querySelectorAll('.cmb:checked'),function(c){return c.value});if(!ids.length){toast('Select at least one document','error');return}var all=LS.get(window._combineKey,[]);var picked=ids.map(function(id){return all.find(function(d){return d.id===id})}).filter(Boolean);toast('Building PDF…','info');try{await combineToPdf(picked,'FamilyVault_documents.pdf');modal('confirmModal',false);toast('Combined PDF downloaded','success')}catch(e){toast('Could not build the PDF','error')}}
function renameDoc(id,key){key=key||('docs_'+currentMember.id);window._rnKey=key;var d=LS.get(key,[]).find(function(x){return x.id===id});if(!d)return;var sharedUI='';if(key!=='docs_general'&&currentMember){var others=LS.get('members',[]).filter(function(m){return m.id!==currentMember.id});if(others.length){sharedUI='<div class="input-group"><label><i class="fas fa-share-nodes" style="margin-right:4px;color:var(--accent2)"></i>Also show in other members</label><div style="display:flex;flex-wrap:wrap;gap:10px">'+others.map(function(m){return'<label style="display:flex;align-items:center;gap:6px;font-size:.85rem;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;cursor:pointer"><input type="checkbox" class="rn_share" value="'+m.id+'"'+((d.shared||[]).indexOf(m.id)>=0?' checked':'')+' style="width:16px;height:16px"> '+esc(m.name)+'</label>'}).join('')+'</div></div>'}else{sharedUI='<div class="input-group"><label><i class="fas fa-share-nodes" style="margin-right:4px;color:var(--text-muted)"></i>Also show in other members</label><div style="font-size:.78rem;color:var(--text-muted)">Add more family members to share this document with them.</div></div>'}}document.getElementById('confirmModalInner').innerHTML='<h2 style="justify-content:flex-start"><i class="fas fa-pen" style="color:var(--accent)"></i> Edit Document</h2><div style="text-align:left"><div class="input-group"><label>Name</label><input id="rn_name" value="'+esc(d.name||'')+'"></div><div class="form-row"><div class="input-group"><label>Tags (comma-separated)</label><input id="rn_tags" value="'+esc((d.tags||[]).join(', '))+'"></div><div class="input-group"><label>Expiry date</label><input type="date" id="rn_exp" value="'+esc(d.expiry||'')+'"></div></div>'+sharedUI+'</div><div class="modal-actions"><button class="btn btn-secondary" onclick="modal(\'confirmModal\',false)">Cancel</button><button class="btn btn-primary" onclick="saveRenameDoc(\''+id+'\')">Save</button></div>';document.getElementById('confirmModal').querySelector('.modal').style.maxWidth='440px';modal('confirmModal',true)}
function saveRenameDoc(id){var key=window._rnKey||('docs_'+currentMember.id);var nm=(document.getElementById('rn_name').value||'').trim();var tags=parseTags(document.getElementById('rn_tags').value);var exp=document.getElementById('rn_exp')?document.getElementById('rn_exp').value:'';var shared=Array.prototype.map.call(document.querySelectorAll('.rn_share:checked'),function(c){return c.value});var docs=LS.get(key,[]).map(function(d){return d.id===id?Object.assign({},d,{name:nm||d.name,tags:tags,expiry:exp,shared:shared}):d});LS.set(key,docs);modal('confirmModal',false);if(key==='docs_general'){renderGeneralDocs()}else{renderTab()}toast('Updated','success')}

function extractMetric(text){if(!text)return null;var sel=document.getElementById('h_name');var chosen=sel?sel.value:'';var metrics=parseReportMetrics(text);

  if(chosen&&chosen!=='__add__'){var hit=null;for(var i=0;i<metrics.length;i++){if(metrics[i].name===chosen){hit=metrics[i];break}}if(hit){setMetricValue(hit.value);return{name:chosen,value:hit.value}}

    var lc=text.toLowerCase();var key=chosen.toLowerCase().replace(/\(.*?\)/g,'').trim().split(' ')[0];var idx=key?lc.indexOf(key):-1;var num=null;if(idx>=0){var mm=text.slice(idx,idx+80).match(/(\d+(?:\.\d+)?)/);if(mm)num=mm[1]}if(num===null){var m2=text.match(/(\d+(?:\.\d+)?)/);if(m2)num=m2[1]}if(num!==null){setMetricValue(num);return{name:chosen,value:num}}return null}

// True when `key` appears in `lc` as a whole word/phrase (not glued inside another word,
// e.g. "ldl" must NOT match inside "vldl"). Returns the index just after the key, or -1.
function keyEndIndex(lc,key){
  var isW=/[a-z0-9]/,from=0,idx;
  while((idx=lc.indexOf(key,from))>=0){
    var before=idx>0?lc.charAt(idx-1):' ';
    var after=(idx+key.length<lc.length)?lc.charAt(idx+key.length):' ';
    var leftOK=!(isW.test(before)&&isW.test(key.charAt(0)));
    var rightOK=!(isW.test(after)&&isW.test(key.charAt(key.length-1)));
    if(leftOK&&rightOK)return idx+key.length;
    from=idx+1;
  }
  return -1;
}

function cleanTestName(s){

// Scan the OCR text line by line and pull out {name,value} pairs for every test.
// Pass 1 uses the alias list so KNOWN tests get clean names + reference ranges;
// pass 2 (generic) captures every other test on the report as well.
// One test per line; when several aliases match a line the LONGEST match wins
// (so "LDL/HDL Ratio" beats "LDL", "VLDL" beats "LDL", etc).
function parseReportMetrics(rawText){

  parseGenericMetrics(lines,found,matchedLines).forEach(function(g){out.push(g);found[g.name]=true});

}
// Best-effort report date from the text; falls back to today.
function findReportDate(text){

  return today;
}

async function renderPdfInto(dataUrl,container){

// ===== Per-member reference ranges (min/max/unit) — set once, editable anytime =====
// Stored per member so values that differ by sex/age (e.g. Hemoglobin) can vary per person.
function refRangesKey(){return 'refranges_'+currentMember.id}
function getRefRanges(){return LS.get(refRangesKey(),{})}
function setRefRanges(obj){LS.set(refRangesKey(),obj)}
// Effective definition for a metric: built-in defaults overlaid with the member's saved ranges/units.
function metricDef(name){var base=METRICS[name]||{};var ov=(getRefRanges()||{})[name]||{};var d=Object.assign({unit:'',low:null,high:null,icon:'fa-chart-simple',color:'#6c63ff'},base);if(ov.unit!==undefined&&ov.unit!=='')d.unit=ov.unit;if(ov.low!==undefined&&ov.low!==''&&ov.low!==null)d.low=Number(ov.low);if(ov.high!==undefined&&ov.high!==''&&ov.high!==null)d.high=Number(ov.high);return d}
// All selectable test names: built-in + custom (from saved ranges) + anything already logged.
function allMetricNames(){var set=[];Object.keys(METRICS).forEach(function(n){set.push(n)});Object.keys(getRefRanges()).forEach(function(n){if(set.indexOf(n)<0)set.push(n)});getMetrics().forEach(function(r){if(r.name&&set.indexOf(r.name)<0)set.push(r.name)});return set}

function getLatest(name,all){var filtered=all.filter(function(r){return r.name===name}).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')});return filtered[0]||null}
function getTrend(name,all){var filtered=all.filter(function(r){return r.name===name}).sort(function(a,b){return(a.date||'').localeCompare(b.date||'')});if(filtered.length<2)return{dir:'stable',pct:0};var prev=filtered[filtered.length-2].value,cur=filtered[filtered.length-1].value;var diff=cur-prev;var pct=prev?Math.round(Math.abs(diff/prev)*100):0;return{dir:diff>1?'up':diff<-1?'down':'stable',pct:pct}}
function getStatus(name,val){var m=metricDef(name);var hasLow=m.low!=null,hasHigh=m.high!=null&&m.high!==999;if(!hasLow&&!hasHigh)return'normal';if(hasHigh&&val>m.high)return'high';if(hasLow&&val<m.low)return'low-val';return'normal'}

function getUpcomingFollowups(){var today=new Date().toISOString().split('T')[0];var upcoming=[];members.forEach(function(m){var visits=LS.get('visits_'+m.id,[]);visits.forEach(function(v){if(v.followup&&v.followup>=today){upcoming.push({member:m.name,memberId:m.id,doctor:v.doctor,date:v.followup,diagnosis:v.diagnosis})}})});return upcoming.sort(function(a,b){return a.date.localeCompare(b.date)})}
// Urgency helpers — colour now MEANS something: red ≤3 days, amber ≤14 days, teal beyond.
function _fuDaysAway(dateStr){var t=new Date();t.setHours(0,0,0,0);var d=new Date(dateStr+'T00:00:00');return Math.round((d-t)/86400000)}
function _fuColor(days){return days<=3?'var(--danger)':days<=14?'var(--warning)':'var(--accent2)'}
function _fuBadge(days){return days<=0?'today':days===1?'tomorrow':'in '+days+'d'}
function followupCard(f){var days=_fuDaysAway(f.date);var col=_fuColor(days);var badge='<span style="font-size:.68rem;background:'+col+';color:#fff;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:middle">'+_fuBadge(days)+'</span>';return'<div class="followup-card" onclick="modal(\'confirmModal\',false);viewMember(\''+f.memberId+'\')"><div style="width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-calendar-day" style="color:'+col+'"></i></div><div style="flex:1;min-width:0"><div class="fu-date" style="color:'+col+'">'+fmtDate(f.date)+badge+'</div><div class="fu-doc">Dr. '+esc(f.doctor)+(f.diagnosis?' — '+esc(f.diagnosis):'')+' ('+esc(f.member)+')</div></div></div>'}
function renderFollowups(){var all=getUpcomingFollowups();if(!all.length)return'';var today=new Date();today.setHours(0,0,0,0);var cutoff=new Date(today.getFullYear(),today.getMonth()+2,today.getDate());var within=all.filter(function(f){return new Date(f.date+'T00:00:00')<=cutoff});var laterCount=all.length-within.length;var viewAllBtn='<button class="btn btn-secondary btn-sm" style="margin-left:auto;padding:4px 10px" onclick="openAllFollowups()">View all ('+all.length+')</button>';var html='<div class="glass" style="padding:20px;margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap"><h3 style="font-size:.95rem;display:flex;align-items:center;gap:8px;margin:0"><i class="fas fa-calendar-check" style="color:var(--accent2)"></i> Upcoming Follow-ups</h3><span style="font-size:.66rem;color:var(--text-muted);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:10px">next 2 months</span>'+((laterCount>0||within.length>6)?viewAllBtn:'')+'</div>';if(!within.length){html+='<div style="font-size:.82rem;color:var(--text-dim);display:flex;align-items:center;gap:8px"><i class="fas fa-circle-check" style="color:var(--accent2)"></i> Nothing due in the next 2 months.'+(laterCount>0?' <button class="btn btn-secondary btn-sm" style="padding:3px 9px" onclick="openAllFollowups()">See '+laterCount+' later</button>':'')+'</div>'}within.slice(0,6).forEach(function(f){html+=followupCard(f)});if(within.length>6)html+='<button class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;margin-top:4px" onclick="openAllFollowups()">+ '+(within.length-6)+' more this window · View all</button>';html+='</div>';return html}
function openAllFollowups(){var all=getUpcomingFollowups();var html='<h2 style="justify-content:flex-start"><i class="fas fa-calendar-check" style="color:var(--accent2)"></i> All Upcoming Follow-ups</h2>';if(!all.length){html+='<div class="empty-state"><i class="fas fa-calendar-check"></i><p>No upcoming follow-ups scheduled.</p></div>'}else{html+='<p style="color:var(--text-dim);font-size:.78rem;text-align:left;margin-bottom:4px">'+all.length+' follow-up'+(all.length>1?'s':'')+' · colour shows urgency (<span style="color:var(--danger)">≤3d</span>, <span style="color:var(--warning)">≤14d</span>, <span style="color:var(--accent2)">later</span>)</p><div style="text-align:left;max-height:60vh;overflow-y:auto">';var groups={},order=[];all.forEach(function(f){var d=new Date(f.date+'T00:00:00');var key=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});if(!groups[key]){groups[key]=[];order.push(key)}groups[key].push(f)});order.forEach(function(mk){html+='<div style="font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin:14px 0 6px">'+esc(mk)+'</div>';groups[mk].forEach(function(f){html+=followupCard(f)})});html+='</div>'}html+='<div class="modal-actions" style="justify-content:center"><button class="btn btn-secondary" onclick="modal(\'confirmModal\',false)">Close</button></div>';document.getElementById('confirmModalInner').innerHTML=html;document.getElementById('confirmModal').querySelector('.modal').style.maxWidth='520px';modal('confirmModal',true)}

function handleShortcut(){try{var a=new URLSearchParams(location.search).get('a');if(!a)return;if(localStorage.getItem('fv_auth')!=='1')return;setTimeout(function(){if(a==='add')openMemberModal();else if(a==='search')openGlobalSearch();else if(a==='contacts')openContacts()},400);history.replaceState({},'',location.pathname)}catch(e){}}
handleShortcut();
</script>
